name: Test and publish Docker image

on:
    push:
        branches: ["main"]
    pull_request:
    workflow_dispatch:

# A newer push to the same branch/PR supersedes the running pipeline.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    # GHCR image names must be lowercase.
    IMAGE: ghcr.io/qed-uam/qed-website

jobs:
    check:
        name: Type check, lint and unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm test

    e2e:
        name: End-to-end tests
        runs-on: ubuntu-latest
        timeout-minutes: 30
        services:
            mongo:
                image: mongo:7
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 6
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            # The global setup seeds qed_e2e_test from fixtures only (no source database in CI).
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-traces
                  path: test-results/
                  retention-days: 7

    docker:
        name: Build and publish image
        needs: [check, e2e]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7

            - uses: docker/metadata-action@v6
              id: meta
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=raw,value=prod,enable=${{ github.ref == 'refs/heads/main' }}
                      type=sha,format=long,prefix=
                      type=ref,event=pr

            # No .env is written here: configuration and secrets are provided to the container
            # at runtime on the server (see deploy/docker-compose.example.yml).
            - uses: docker/login-action@v4
              if: github.event_name != 'pull_request'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/setup-buildx-action@v4

            # Pull requests only build the image, to catch Dockerfile breakage before merging.
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
