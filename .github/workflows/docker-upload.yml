name: Test and publish Docker image

on:
    push:
        branches: ["main"]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm test

    publish:
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # No .env is written here: configuration and secrets are provided to the container
            # at runtime on the server (see deploy/docker-compose.example.yml).
            - uses: docker/login-action@v3
              with:
                  username: qeduam
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - uses: docker/setup-buildx-action@v3

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      qeduam/qed-website:prod
                      qeduam/qed-website:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
