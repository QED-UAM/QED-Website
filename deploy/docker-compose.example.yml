# Example production setup: the website, MongoDB and Watchtower.
#
#   cp .env.example .env   # fill in the secrets, set MONGODB_URI=mongodb://mongo:27017/qed
#   docker compose -f docker-compose.example.yml up -d
#
# Recovery after Watchtower updates:
#  - `web` waits for a healthy MongoDB before starting, and retries the connection itself.
#  - If MongoDB stays unreachable for DB_WATCHDOG_SECONDS, `web` exits and `restart:` starts a
#    fresh process (new DNS lookup and connection pools).
#  - The offline pages poll /endpoints/health, which is only 200 when MongoDB is reachable.
#
# Rollback: pin `image:` to a previous tag, e.g. ghcr.io/qed-uam/qed-website:<commit sha>.

services:
    web:
        image: ghcr.io/qed-uam/qed-website:prod
        restart: unless-stopped
        env_file: .env
        environment:
            NODE_ENV: production
            MONGODB_URI: mongodb://mongo:27017/qed
        ports:
            - "127.0.0.1:3000:3000"
        depends_on:
            mongo:
                condition: service_healthy
        labels:
            - com.centurylinklabs.watchtower.enable=true

    mongo:
        # Keep the major version you already run; upgrading MongoDB is a separate, deliberate step.
        image: mongo:7
        restart: unless-stopped
        volumes:
            - mongo-data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s
        labels:
            # Update the database deliberately, not automatically.
            - com.centurylinklabs.watchtower.enable=false

    watchtower:
        image: containrrr/watchtower
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        command: --label-enable --cleanup --interval 300

volumes:
    mongo-data:
